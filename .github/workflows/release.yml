# Builds the packages for all supported distributions.
#
# - Push of a tag "v*" (e.g. v2.6.3): build the .deb/.rpm packages, publish
#   them as a GitHub release with a list of changes, and publish the AUR
#   package linux-g13-driver-git (when the secret AUR_SSH_PRIVATE_KEY is set).
# - Push to dev or manually ("Run workflow"): build only; the packages are
#   available as artifacts of the run for testing.
#
# .deb/.rpm are built with g13-driver/packaging/build-package.sh inside a
# container of the respective distribution (same script as for local builds).
# Older distributions are built on purpose: since Linux 6.19 the kernel
# supports the G13 itself (see gkey-config), this driver is mainly for older kernels.

name: Release packages

on:
  push:
    branches: [dev]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian12,    image: "debian:12" }
          - { name: debian13,    image: "debian:13" }
          - { name: ubuntu22.04, image: "ubuntu:22.04" }
          - { name: ubuntu24.04, image: "ubuntu:24.04" }
          - { name: ubuntu26.04, image: "ubuntu:26.04" }
          - { name: fedora43,    image: "fedora:43" }
          - { name: fedora44,    image: "fedora:44" }

    steps:
      # git before the checkout, so that the full history including tags
      # (needed for the version number) is checked out.
      - name: Install git
        run: |
          if command -v apt-get >/dev/null; then
            # Ubuntu mirror inside Azure (as on the GitHub runners): faster than
            # archive.ubuntu.com. Retry: a mirror in sync can serve
            # inconsistent index files for a while.
            sed -i 's#http://archive.ubuntu.com/#http://azure.archive.ubuntu.com/#' \
              /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
            echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
            for attempt in 1 2 3; do
              apt-get update -q && break
              [ "$attempt" = 3 ] && exit 1
              sleep 60
            done
            apt-get install -y -q --no-install-recommends git ca-certificates
          else
            dnf install -y -q git
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version
        if: github.ref_type == 'tag'
        run: |
          # The project version in CMakeLists.txt must match the tag.
          PROJECT=$(sed -n 's/^project(Linux-G13-Driver VERSION \([0-9.]*\).*/\1/p' g13-driver/CMakeLists.txt)
          if [ "v$PROJECT" != "$GITHUB_REF_NAME" ]; then
            echo "g13-driver/CMakeLists.txt has version $PROJECT, the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build package
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export G13_PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          g13-driver/packaging/build-package.sh dist

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  arch:
    name: Build Arch Linux (AUR)
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare PKGBUILD
        run: |
          # aur/: the files published to the AUR (source = GitHub).
          # build/: the same PKGBUILD, but it builds the checked-out commit.
          mkdir -p aur build
          cp g13-driver/packaging/arch/PKGBUILD g13-driver/packaging/arch/linux-g13-driver-git.install aur/
          cp aur/PKGBUILD aur/linux-g13-driver-git.install build/
          sed -i "s|^source=.*|source=(\"linux-g13-driver::git+file://$GITHUB_WORKSPACE#commit=$GITHUB_SHA\")|" build/PKGBUILD
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          sudo -u builder git config --global --add safe.directory '*'
          chown -R builder: aur build

      - name: Build linux-g13-driver-git
        working-directory: build
        run: sudo -u builder makepkg -s --noconfirm

      - name: Write .SRCINFO
        run: |
          # makepkg has set pkgver from the tag; publish it with the GitHub source.
          VERSION=$(sed -n 's/^pkgver=//p' build/PKGBUILD)
          sed -i "s/^pkgver=.*/pkgver=$VERSION/;s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          cd aur
          sudo -u builder makepkg --printsrcinfo | tee .SRCINFO

      - name: Upload AUR files
        uses: actions/upload-artifact@v7
        with:
          name: aur
          path: |
            aur/PKGBUILD
            aur/.SRCINFO
            aur/linux-g13-driver-git.install
            build/*.pkg.tar.zst
          include-hidden-files: true
          if-no-files-found: error

  # Runs on every push so that the release notes and the download are tested;
  # the GitHub release itself is only created for tags.
  release:
    name: Publish release
    needs: [packages, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG=HEAD; fi
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${TAG}^" 2>/dev/null || true)
          {
            echo "## Changes"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s (%h)' "${PREV}..${TAG}"
            else
              git log --no-merges --pretty='- %s (%h)' "${TAG}"
            fi
            echo
            echo "## Installation"
            echo
            echo "Since Linux 6.19 the kernel supports the G13 itself; for current kernels see"
            echo "[gkey-config](https://github.com/Lordbooker/gkey-config)."
            echo
            echo "| System | Package |"
            echo "|---|---|"
            # GitHub replaces "~" in file names of release assets with "."
            echo "| Debian 12 / 13 | \`linux-g13-driver_*.debian12_amd64.deb\` / \`*.debian13_amd64.deb\` |"
            echo "| Ubuntu 22.04 / 24.04 / 26.04 (and Linux Mint, Pop!_OS, ...) | \`linux-g13-driver_*.ubuntuXX.04_amd64.deb\` |"
            echo "| Fedora 43 / 44 (and Nobara, ...) | \`linux-g13-driver-*.fc43.x86_64.rpm\` / \`*.fc44.x86_64.rpm\` |"
            echo "| Arch Linux | AUR: \`linux-g13-driver-git\` |"
            echo
            echo '```bash'
            echo '# Debian / Ubuntu'
            echo 'sudo apt install ./linux-g13-driver_<version>-1.<system>_amd64.deb'
            echo '# Fedora'
            echo 'sudo dnf install ./linux-g13-driver-<version>-1.fc<NN>.x86_64.rpm'
            echo '# then, as your user:'
            echo 'systemctl --user enable --now g13'
            echo '```'
            echo
            echo "Upgrading from 1.x (GTK tray / Java tool): run \`make remove-legacy\` from the"
            echo "source tree first, see the README section \"Upgrading from the old Version\"."
          } > release-notes.md
          cat release-notes.md
          ls -l dist

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run (e.g. after adding the AUR secret) replaces the assets.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi

  aur:
    name: Publish to the AUR
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

    steps:
      - name: Check secret
        id: secret
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::Secret AUR_SSH_PRIVATE_KEY not set: the AUR files are only available as artifact 'aur'."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download AUR files
        if: steps.secret.outputs.present == 'true'
        uses: actions/download-artifact@v8
        with:
          name: aur
          path: artifact

      - name: Push to the AUR
        if: steps.secret.outputs.present == 'true'
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git config --global user.name "Lordbooker"
          git config --global user.email "lordbooker@gmail.com"
          git clone ssh://aur@aur.archlinux.org/linux-g13-driver-git.git repo
          cp artifact/aur/PKGBUILD artifact/aur/.SRCINFO artifact/aur/linux-g13-driver-git.install repo/
          cd repo
          git add PKGBUILD .SRCINFO linux-g13-driver-git.install
          if git diff --cached --quiet; then
            echo "linux-g13-driver-git: unchanged"
          else
            git commit -m "Update to $GITHUB_REF_NAME"
            git push origin HEAD:master
          fi
