name: Build

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch Linux
            image: archlinux:latest
            install: >-
              pacman -Syu --noconfirm --needed
              base-devel cmake git pkgconf libusb qt6-base qt6-tools qt6-declarative systemd desktop-file-utils
          - distro: Fedora
            image: fedora:latest
            install: >-
              dnf install -y
              gcc-c++ cmake git pkgconf-pkg-config libusb1-devel qt6-qtbase-devel qt6-qttools-devel
              systemd-udev desktop-file-utils
          - distro: Debian testing
            image: debian:testing
            install: >-
              apt-get update &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y
              build-essential cmake git pkg-config libusb-1.0-0-dev qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools
              udev desktop-file-utils

    steps:
      - name: Install dependencies
        run: ${{ matrix.install }}

      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S g13-driver -B build -DCMAKE_BUILD_TYPE=Debug -DG13_WERROR=ON -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Verify udev rule
        run: |
          if udevadm verify --help >/dev/null 2>&1; then
            udevadm verify --resolve-names=never g13-driver/src/udev/70-g13.rules
          else
            echo "udevadm verify not available, skipped"
          fi

      - name: Validate desktop files
        run: desktop-file-validate g13-driver/src/desktop/*.desktop

      - name: Install into staging directory
        run: DESTDIR="$PWD/stage" cmake --install build

  lint:
    name: Static analysis
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            cmake pkg-config clang clang-tidy cppcheck shellcheck \
            libusb-1.0-0-dev qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl-dev

      # clang-tidy needs the compile commands and the files generated by moc/uic.
      - name: Build with clang
        run: |
          CXX=clang++ cmake -S g13-driver -B build -DCMAKE_BUILD_TYPE=Debug -DG13_WERROR=ON
          cmake --build build --parallel

      - name: clang-tidy
        run: |
          run-clang-tidy -quiet -p build -warnings-as-errors='*' -j "$(nproc)" \
            g13-driver/src/driver/*.cpp g13-driver/src/gui/*.cpp

      - name: cppcheck
        run: |
          cppcheck --error-exitcode=1 --quiet --inline-suppr --std=c++20 \
            --enable=warning,style,performance,portability --suppress=missingIncludeSystem \
            -I g13-driver/src/driver g13-driver/src/driver
          cppcheck --error-exitcode=1 --quiet --inline-suppr --std=c++20 --library=qt \
            --enable=warning,performance,portability --suppress=missingIncludeSystem \
            "-DQ_DISABLE_COPY_MOVE(x)=" -I g13-driver/src/gui g13-driver/src/gui

      - name: shellcheck
        run: |
          shellcheck -S warning g13-driver/scripts/*.sh g13-driver/packaging/build-package.sh \
            g13-driver/packaging/deb/postinst g13-driver/packaging/deb/postrm
          shellcheck -S warning -s sh g13-driver/packaging/rpm/post
          shellcheck -S warning -s bash g13-driver/packaging/arch/PKGBUILD \
            g13-driver/packaging/arch/linux-g13-driver-git.install \
            -e SC2034,SC2154,SC2164

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
